# Ephemeral PostgreSQL and Redis for backend integration tests.
# Used by scripts/test-backend.sh; data lives in tmpfs and is discarded on teardown.
# Ports bind to loopback only and are assigned by Docker to avoid collisions.
name: tracehollow-test

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_USER: tracehollow_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?generated by scripts/test-backend.sh}
      POSTGRES_DB: tracehollow_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracehollow_test -d tracehollow_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.1-trixie@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    command:
      - redis-server
      - --requirepass
      - ${TEST_REDIS_PASSWORD:?generated by scripts/test-backend.sh}
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$TEST_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      TEST_REDIS_PASSWORD: ${TEST_REDIS_PASSWORD}
