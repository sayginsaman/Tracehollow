name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests against ephemeral PostgreSQL and Redis
        working-directory: .
        run: scripts/test-backend.sh
      - name: Application modules import with runtime dependencies only
        run: |
          uv sync --locked --no-default-groups
          uv run --no-sync python -c "import app.main, app.tasks.celery_app, app.tasks.ai, app.tasks.queries, app.connectors.registry, app.egress.gateway"

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Compose stack verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install web dependencies and the Playwright browser
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Phase 0 foundation checks
        run: scripts/verify-phase0.sh
      - name: Phase 1 lifecycle, recovery and browser workflow checks
        run: scripts/verify-phase1.sh --e2e
      - name: Phase 2 collection, SSRF, outcomes and browser workflow checks (controlled fixture source)
        run: scripts/verify-phase2.sh --e2e
      - name: Phase 3 indexing, cited answers, policy and browser workflow checks (synthetic fixture provider)
        run: scripts/verify-phase3.sh --e2e
