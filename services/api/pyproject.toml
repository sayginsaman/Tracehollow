[project]
name = "tracehollow-api"
version = "0.1.0"
description = "Tracehollow API and background worker"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.6.3",
    "fastapi==0.141.1",
    "httpx2==2.13.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "sqlalchemy==2.0.53",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "celery-types==0.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false
required-version = ">=0.11.12"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "FAST", "DTZ", "PT"]
ignore = [
    "S101", # assert is used by pytest
    "FAST003", # case_id path parameters are declared by the shared case-access dependency
]
# Turkish dotless i is intentional in Unicode username handling and fixtures.
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "tests"]

[[tool.mypy.overrides]]
module = ["kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the PostgreSQL and Redis test services",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Upstream starlette.testclient still references a deprecated anyio alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
