# Tracehollow core services.
#
# Before the first start run `scripts/setup.sh` to create `.env` and the files in `secrets/`.
# Only the web UI and the API are published, and only on 127.0.0.1 by default.
# PostgreSQL and Redis are reachable solely on the internal `data` network.
name: tracehollow

x-backend-environment: &backend-environment
  TRACEHOLLOW_ENV: production
  TRACEHOLLOW_LOG_LEVEL: ${TRACEHOLLOW_LOG_LEVEL:-INFO}
  TRACEHOLLOW_PUBLIC_ORIGIN: ${TRACEHOLLOW_PUBLIC_ORIGIN:-http://localhost:${TRACEHOLLOW_WEB_PORT:-3000}}
  TRACEHOLLOW_TRUSTED_ORIGINS: ${TRACEHOLLOW_TRUSTED_ORIGINS:-http://localhost:${TRACEHOLLOW_WEB_PORT:-3000},http://127.0.0.1:${TRACEHOLLOW_WEB_PORT:-3000}}
  TRACEHOLLOW_ALLOWED_HOSTS: ${TRACEHOLLOW_API_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],api}
  TRACEHOLLOW_API_DOCS_ENABLED: ${TRACEHOLLOW_API_DOCS_ENABLED:-false}
  TRACEHOLLOW_SESSION_IDLE_TIMEOUT_MINUTES: ${TRACEHOLLOW_SESSION_IDLE_TIMEOUT_MINUTES:-480}
  TRACEHOLLOW_SESSION_ABSOLUTE_TIMEOUT_HOURS: ${TRACEHOLLOW_SESSION_ABSOLUTE_TIMEOUT_HOURS:-24}
  TRACEHOLLOW_DATABASE_HOST: postgres
  TRACEHOLLOW_DATABASE_NAME: tracehollow
  TRACEHOLLOW_DATABASE_USER: tracehollow_app
  TRACEHOLLOW_DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
  TRACEHOLLOW_REDIS_HOST: redis
  TRACEHOLLOW_REDIS_PASSWORD_FILE: /run/secrets/redis_password
  TRACEHOLLOW_SECRET_KEY_FILE: /run/secrets/app_secret_key
  TRACEHOLLOW_EVIDENCE_STORAGE_PATH: /data/evidence
  # Evidence-grounded AI (docs/operations/ai-models.md). No model is needed to start the stack.
  TRACEHOLLOW_AI_ENABLED: ${TRACEHOLLOW_AI_ENABLED:-true}
  TRACEHOLLOW_AI_LOCAL_PROVIDER: ${TRACEHOLLOW_AI_LOCAL_PROVIDER:-ollama}
  TRACEHOLLOW_AI_OLLAMA_BASE_URL: ${TRACEHOLLOW_AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  TRACEHOLLOW_AI_GENERATION_MODEL: ${TRACEHOLLOW_AI_GENERATION_MODEL:-qwen3:8b}
  TRACEHOLLOW_AI_EMBEDDING_MODEL: ${TRACEHOLLOW_AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  TRACEHOLLOW_AI_NUM_CTX: ${TRACEHOLLOW_AI_NUM_CTX:-16384}
  TRACEHOLLOW_AI_EMBEDDING_NUM_CTX: ${TRACEHOLLOW_AI_EMBEDDING_NUM_CTX:-8192}
  TRACEHOLLOW_AI_REQUEST_TIMEOUT_SECONDS: ${TRACEHOLLOW_AI_REQUEST_TIMEOUT_SECONDS:-300}
  TRACEHOLLOW_AI_CLOUD_PROVIDER: ${TRACEHOLLOW_AI_CLOUD_PROVIDER:-none}
  TRACEHOLLOW_AI_CLOUD_MODEL: ${TRACEHOLLOW_AI_CLOUD_MODEL:-claude-sonnet-5}
  # Public-source collection (docs/connectors/README.md).
  TRACEHOLLOW_COLLECTION_ALLOWED_PRIVATE_NETWORKS: ${TRACEHOLLOW_COLLECTION_ALLOWED_PRIVATE_NETWORKS:-}
  TRACEHOLLOW_COLLECTION_ALLOWED_PORTS: ${TRACEHOLLOW_COLLECTION_ALLOWED_PORTS:-80,443}
  TRACEHOLLOW_GITHUB_API_BASE_URL: ${TRACEHOLLOW_GITHUB_API_BASE_URL:-https://api.github.com}
  # Social platform connectors (docs/connectors/instagram.md, telegram.md, youtube.md).
  TRACEHOLLOW_INSTAGRAM_GRAPH_API_BASE_URL: ${TRACEHOLLOW_INSTAGRAM_GRAPH_API_BASE_URL:-https://graph.facebook.com}
  TRACEHOLLOW_INSTAGRAM_WEB_BASE_URL: ${TRACEHOLLOW_INSTAGRAM_WEB_BASE_URL:-https://www.instagram.com}
  TRACEHOLLOW_INSTAGRAM_PUBLIC_WEB_ENABLED: ${TRACEHOLLOW_INSTAGRAM_PUBLIC_WEB_ENABLED:-false}
  TRACEHOLLOW_TELEGRAM_WEB_BASE_URL: ${TRACEHOLLOW_TELEGRAM_WEB_BASE_URL:-https://t.me}
  TRACEHOLLOW_TELEGRAM_BOT_API_BASE_URL: ${TRACEHOLLOW_TELEGRAM_BOT_API_BASE_URL:-https://api.telegram.org}
  TRACEHOLLOW_YOUTUBE_API_BASE_URL: ${TRACEHOLLOW_YOUTUBE_API_BASE_URL:-https://www.googleapis.com/youtube/v3}
  # Authorized imports and document processing (docs/operations/document-processing.md).
  TRACEHOLLOW_DOCUMENT_OCR_ENABLED: ${TRACEHOLLOW_DOCUMENT_OCR_ENABLED:-true}
  TRACEHOLLOW_DOCUMENT_OCR_LANGUAGES: ${TRACEHOLLOW_DOCUMENT_OCR_LANGUAGES:-eng+tur}

x-api-image: &api-image
  image: tracehollow-api:local
  build:
    context: ./services/api
    args:
      # true adds the Tesseract OCR engine (English and Turkish data) for scanned PDFs.
      INSTALL_OCR: ${TRACEHOLLOW_INSTALL_OCR:-false}

x-collector-image: &collector-image
  image: tracehollow-collector:local
  build:
    context: ./services/api
    target: collector

x-discovery-runner-image: &discovery-runner-image
  image: tracehollow-discovery-runner:local
  build:
    context: ./services/api
    target: discovery-runner

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_DB: tracehollow
      TRACEHOLLOW_APP_DB_USER: tracehollow_app
    secrets:
      - postgres_superuser_password
      - postgres_app_password
    volumes:
      # PostgreSQL 18 images keep versioned data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracehollow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.10.1-trixie@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    restart: unless-stopped
    # The ACL file holds only a SHA-256 digest of the password (generated by scripts/setup.sh).
    command: ["redis-server", "--aclfile", "/run/secrets/redis_users_acl", "--appendonly", "yes"]
    secrets:
      - redis_users_acl
      - redis_password
    volumes:
      - redis-data:/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # pgvector is not a trusted extension, so the non-superuser application role cannot create it.
  # This one-shot job installs it (idempotently) as the PostgreSQL superuser before migrations.
  db-extensions:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: "no"
    user: postgres
    entrypoint: ["sh", "-c"]
    command:
      - >-
        PGPASSWORD="$$(cat /run/secrets/postgres_superuser_password)"
        exec psql --no-psqlrc -v ON_ERROR_STOP=1 -h postgres -U postgres -d tracehollow
        -c 'CREATE EXTENSION IF NOT EXISTS vector'
    secrets:
      - postgres_superuser_password
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: [*api-image, *hardened]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *backend-environment
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
      db-extensions:
        condition: service_completed_successfully

  api:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      TRACEHOLLOW_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      # The API only needs to know whether a cloud key is configured; it never calls a model.
      TRACEHOLLOW_AI_CLOUD_API_KEY_FILE: /run/secrets/cloud_ai_api_key
      # Encrypts connector credentials entered by an administrator (never stored in PostgreSQL).
      TRACEHOLLOW_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
      - bootstrap_token
      - cloud_ai_api_key
      - credential_encryption_key
    volumes:
      - evidence-data:/data/evidence
    ports:
      - "${TRACEHOLLOW_API_BIND_ADDRESS:-127.0.0.1}:${TRACEHOLLOW_API_PORT:-8000}:8000"
    networks: [edge, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    command:
      - celery
      - --app=app.tasks.worker
      - worker
      - --hostname=worker@%h
      - --queues=tracehollow
      - --concurrency=2
      - --loglevel=INFO
    environment: *backend-environment
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
    volumes:
      - evidence-data:/data/evidence
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=app.tasks.worker inspect ping --destination=worker@$$(hostname) --timeout=5 >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s

  dispatcher:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    # Publishes outbox rows, re-queues lost or abandoned work and reconciles evidence writes.
    command: ["python", "-m", "app.dispatch.relay"]
    environment: *backend-environment
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
    volumes:
      - evidence-data:/data/evidence
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/tracehollow-dispatcher.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # Public-source collection. Runs every query execution that contacts an external source. It has
  # outbound access (collect-egress); every URL it fetches for a case passes the SSRF checks in
  # app/connectors/netguard.py. It does not run Subfinder: passive domain discovery is sent to
  # the discovery-runner sandbox below.
  collector:
    <<: [*collector-image, *hardened]
    restart: unless-stopped
    command:
      - celery
      - --app=app.tasks.worker
      - worker
      - --hostname=collector@%h
      - --queues=tracehollow-collect
      - --concurrency=4
      - --loglevel=INFO
    environment:
      <<: *backend-environment
      TRACEHOLLOW_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      TRACEHOLLOW_DISCOVERY_RUNNER_URL: http://discovery-runner:8090
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
      - credential_encryption_key
    volumes:
      - evidence-data:/data/evidence
    networks: [data, collect-egress, discovery]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=app.tasks.worker inspect ping --destination=collector@$$(hostname) --timeout=5 >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  # Network sandbox for Subfinder (ADR 0007). Its only network is the internal `discovery`
  # network (no route out, no external DNS, no host address); it holds no secrets and no
  # database access. It refuses jobs when those conditions are not met.
  discovery-runner:
    <<: [*discovery-runner-image, *hardened]
    restart: unless-stopped
    environment:
      TRACEHOLLOW_LOG_LEVEL: ${TRACEHOLLOW_LOG_LEVEL:-INFO}
      TRACEHOLLOW_DISCOVERY_GATEWAY: discovery-gateway:3128
      TRACEHOLLOW_DISCOVERY_PEERS: collector
    networks: [discovery]
    depends_on:
      discovery-gateway:
        condition: service_healthy
    healthcheck:
      # Healthy only while the sandbox checks pass and the gateway answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

  # The discovery sandbox's only way out: CONNECT to allowlisted provider host names on port 443,
  # after the collection address policy, with provider certificates verified here.
  discovery-gateway:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    command: ["python", "-m", "app.egress.gateway"]
    environment:
      TRACEHOLLOW_LOG_LEVEL: ${TRACEHOLLOW_LOG_LEVEL:-INFO}
      # Lab use only; loopback, link-local and metadata ranges are always refused.
      TRACEHOLLOW_GATEWAY_ALLOWED_PRIVATE_NETWORKS: ${TRACEHOLLOW_DISCOVERY_ALLOWED_PRIVATE_NETWORKS:-}
    networks: [discovery, collect-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3128/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

  # Outbound access to model endpoints only (Ollama on the host by default, and an optional
  # cloud provider). It consumes AI work only.
  ai-worker:
    <<: [*api-image, *hardened]
    restart: unless-stopped
    command:
      - celery
      - --app=app.tasks.worker
      - worker
      - --hostname=ai-worker@%h
      - --queues=tracehollow-ai
      - --concurrency=2
      - --loglevel=INFO
    environment:
      <<: *backend-environment
      TRACEHOLLOW_AI_CLOUD_API_KEY_FILE: /run/secrets/cloud_ai_api_key
    secrets:
      - postgres_app_password
      - redis_password
      - app_secret_key
      - cloud_ai_api_key
    volumes:
      - evidence-data:/data/evidence
    networks: [data, ai-egress]
    # Lets the container reach Ollama on the host, including on Linux Docker Engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=app.tasks.worker inspect ping --destination=ai-worker@$$(hostname) --timeout=5 >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  web:
    image: tracehollow-web:local
    build:
      context: ./apps/web
    <<: *hardened
    restart: unless-stopped
    environment:
      TRACEHOLLOW_API_INTERNAL_URL: http://api:8000
      TRACEHOLLOW_WEB_ALLOWED_HOSTS: ${TRACEHOLLOW_WEB_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      TRACEHOLLOW_WEB_MAX_PROCESSING_UPLOAD_BYTES: ${TRACEHOLLOW_WEB_MAX_PROCESSING_UPLOAD_BYTES:-134283264}
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=10001,gid=10001
    ports:
      - "${TRACEHOLLOW_WEB_BIND_ADDRESS:-127.0.0.1}:${TRACEHOLLOW_WEB_PORT:-3000}:3000"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  edge: {}
  data:
    internal: true
  # Egress for model requests only; attached solely to ai-worker.
  ai-egress: {}
  # Egress for public-source collection; attached to collector and discovery-gateway.
  collect-egress: {}
  # Subfinder sandbox: no route out and, with isolated gateway mode (Docker Engine 28 or later),
  # no address for the host on the bridge. Only collector, discovery-runner and
  # discovery-gateway are attached.
  discovery:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  postgres-data: {}
  redis-data: {}
  evidence-data: {}

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  redis_password:
    file: ./secrets/redis_password
  redis_users_acl:
    file: ./secrets/redis_users.acl
  app_secret_key:
    file: ./secrets/app_secret_key
  bootstrap_token:
    file: ./secrets/bootstrap_token
  # Optional: empty unless you configure a cloud provider (docs/operations/ai-models.md).
  cloud_ai_api_key:
    file: ./secrets/cloud_ai_api_key
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
